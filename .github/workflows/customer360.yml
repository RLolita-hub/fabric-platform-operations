name: Customer360 and standalone contracts
on:
  push:
    paths: ['projects/**', '.github/workflows/customer360.yml']
  pull_request:
    paths: ['projects/**', '.github/workflows/customer360.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [customer360-idmc-snowflake-fabric, snowflake-incremental-orders, informatica-idmc-order-quality, informatica-mdm-customer-mastering]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
